[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-founder-os"
version = "0.1.0"
description = "Autonomous multi-agent OS for early-stage startups"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.2",
    "langchain==0.2.1",
    "langchain-google-genai>=2.0.0",
    "langchain-openai==0.1.8",
    "langgraph==0.1.4",
    "langfuse==2.27.0",
    "openai==1.30.1",
    "google-genai>=0.1.0",
    "google-auth==2.29.0",
    "google-auth-oauthlib==1.2.0",
    "google-api-python-client==2.128.0",
    "mcp>=1.0.0",
    "slack-sdk==3.27.2",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "apscheduler==3.10.4",
    "tenacity==8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "httpx==0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
